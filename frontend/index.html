<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookly — Твой персональный шеф-повар</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff8f1',
              100: '#feeed8',
              200: '#fcd9b0',
              300: '#f9bd7d',
              400: '#f59a47',
              500: '#f27c20', // Primary Accent
              600: '#e36015',
              700: '#bc4713',
              800: '#953917',
              900: '#783116',
            },
            cream: '#FFFDF9',
            surface: '#FDF8F2',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'bounce-subtle': 'bounceSubtle 2s infinite',
            'float': 'float 3s ease-in-out infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(-3%)' },
              '50%': { transform: 'translateY(0)' },
            },
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-8px) rotate(2deg)' },
            }
          }
        }
      }
    }
  </script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #FFFDF9;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FFFDF9;
    }
    ::-webkit-scrollbar-thumb {
      background: #fcd9b0;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #f59a47;
    }
    .glass-effect {
      background: rgba(255, 253, 249, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col selection:bg-brand-200 selection:text-brand-900">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- MOCK FALLBACK DATA ---
    const MOCK_INGREDIENTS = [
      { id: '1', name: 'Куриная грудка', category: 'Мясо' },
      { id: '2', name: 'Яйца куриные', category: 'Молочные и яйца' },
      { id: '3', name: 'Сыр Пармезан', category: 'Молочные и яйца' },

      { id: '10', name: 'Лосось', category: 'Рыба' },

    const MOCK_RECIPES = [
      {
        id: 'r1',
        title: 'Паста Карбонара с нежным соусом',
        description: 'Итальянская классика с аппетитным желточным соусом, пармезаном и хрустящей грудинкой.',

        difficulty: 'Легко',
        calories: 520,

        fats: 22,
        carbs: 58,
        ingredientIds: ['2', '3', '5', '7', '8'],
        ingredientsList: [
          { name: 'Спагетти', amount: '200', unit: 'г' },
          { name: 'Яйца куриные', amount: '2', unit: 'шт' },
          { name: 'Сыр Пармезан', amount: '50', unit: 'г' },
          { name: 'Чеснок', amount: '1', unit: 'зубчик' },
          { name: 'Оливковое масло', amount: '1', unit: 'ст.л.' }
        ],
        steps: [
          'Отварите спагетти в кипящей подсоленной воде до состояния al dente.',
          'В миске взбейте яйца с тертым пармезаном и щепоткой свежемолотого перца.',
          'Обжарьте чеснок на оливковом масле до аромата.',
          'Смешайте горячую пасту с яично-сырной смесью, быстро перемешивая.'
        ],
        imageUrl: 'https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'r2',
        title: 'Запеченный лосось с авокадо и шпинатом',
        description: 'Сочный стейк из лосося на подушке из свежего шпината с дольками спелого авокадо.',
        time: 20,
        servings: 1,
        difficulty: 'Средне',
        calories: 430,
        proteins: 32,
        fats: 28,
        carbs: 12,
        ingredientIds: ['6', '8', '10', '12'],
        ingredientsList: [
          { name: 'Лосось', amount: '200', unit: 'г' },
          { name: 'Авокадо', amount: '1/2', unit: 'шт' },
          { name: 'Шпинат', amount: '80', unit: 'г' },
          { name: 'Оливковое масло', amount: '1', unit: 'ч.л.' }
        ],
        steps: [
          'Посолите и поперчите филе лосося.',
          'Обжаривайте на разогретой сковороде по 4-5 минут с каждой стороны.',
          'Выложите шпинат и нарезанный авокадо на тарелку, сверху уложите горячий лосось.'
        ],
        imageUrl: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'r3',
        title: 'Куриная грудка в сливочном соусе с черри',
        description: 'Нежнейшее филе курицы, томленое в густых сливках с томатами черри и чесноком.',
        time: 30,
        servings: 3,
        difficulty: 'Легко',
        calories: 380,
        proteins: 38,
        fats: 18,
        carbs: 10,
        ingredientIds: ['1', '4', '7', '8', '9'],
        ingredientsList: [
          { name: 'Куриная грудка', amount: '500', unit: 'г' },
          { name: 'Томаты черри', amount: '150', unit: 'г' },
          { name: 'Сливки 20%', amount: '200', unit: 'мл' },
          { name: 'Чеснок', amount: '2', unit: 'зубчика' },
          { name: 'Оливковое масло', amount: '1', unit: 'ст.л.' }
        ],
        steps: [
          'Нарежьте куриную грудку ломтиками и обжарьте до золотистой корочки.',
          'Добавьте измельченный чеснок и разрезанные пополам томаты черри.',
          'Влейте сливки, уменьшите огонь и тушите 10 минут до загустения.'
        ],
        imageUrl: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'r4',
        title: 'Пышный омлет с томатами и сыром',
        description: 'Быстрый и сытный завтрак за 10 минут с тянущимся сыром.',
        time: 10,
        servings: 1,
        difficulty: 'Легко',
        calories: 310,
        proteins: 21,
        fats: 22,
        carbs: 5,
        ingredientIds: ['2', '3', '4', '14'],
        ingredientsList: [
          { name: 'Яйца куриные', amount: '3', unit: 'шт' },
          { name: 'Томаты черри', amount: '4', unit: 'шт' },
          { name: 'Сыр Пармезан', amount: '30', unit: 'г' },
          { name: 'Сливочное масло', amount: '15', unit: 'г' }
        ],
        steps: [
          'Взбейте яйца со щепоткой соли.',
          'Растопите сливочное масло на сковороде, вылейте яичную смесь.',
          'Добавьте черри, посыпьте тертым сыром и готовьте под крышкой 5 минут.'
        ],
        imageUrl: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=800&q=80'
      }
    ];

    // Local offline fallback: this asset is loaded relative to frontend/index.html,
    // so it still works when the page is opened directly via file://.
    const RECIPE_IMAGE_PLACEHOLDER = './assets/recipe-placeholder.svg';

    // The API contract and the current database schema do not include imageUrl.
    // Use the existing dish photos for known dish types and a general food photo
    // for other recipes until image URLs are stored in the database.
    const RECIPE_IMAGE_BY_KIND = {
      pasta: 'https://images.unsplash.com/photo-1612874742237-6526221588e3?auto=format&fit=crop&w=800&q=80',
      fish: 'https://images.unsplash.com/photo-1467003909585-2f8a72700288?auto=format&fit=crop&w=800&q=80',
      chicken: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=800&q=80',
      eggs: 'https://images.unsplash.com/photo-1525351484163-7529414344d8?auto=format&fit=crop&w=800&q=80',
      default: 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=800&q=80'
    };

    function resolveRecipeImage(recipe) {
      if (typeof recipe.imageUrl === 'string' && recipe.imageUrl.trim()) return recipe.imageUrl;

      const ingredientNames = Array.isArray(recipe.ingredients)
        ? recipe.ingredients.flatMap(item => [item.name, item.ingredient?.name])
        : Array.isArray(recipe.ingredientsList)
          ? recipe.ingredientsList.map(item => item.name)
          : [];
      const searchableText = [recipe.name, recipe.title, recipe.description, ...ingredientNames]
        .filter(Boolean).join(' ').toLowerCase();

      if (/паст|карбонар|спагет|pasta|spaghetti/.test(searchableText)) return RECIPE_IMAGE_BY_KIND.pasta;
      if (/лосос|рыб|salmon|fish|форел|тунец/.test(searchableText)) return RECIPE_IMAGE_BY_KIND.fish;
      if (/куриц|курин|chicken|цыплён|цыплен/.test(searchableText)) return RECIPE_IMAGE_BY_KIND.chicken;
      if (/омлет|яйц|яич|egg|breakfast/.test(searchableText)) return RECIPE_IMAGE_BY_KIND.eggs;
      return RECIPE_IMAGE_BY_KIND.default;
    }

    function useLocalImageFallback(event) {
      const image = event.currentTarget;
      if (image.dataset.localFallbackApplied === 'true') return;
      image.dataset.localFallbackApplied = 'true';
      image.src = RECIPE_IMAGE_PLACEHOLDER;
    }

    // Convert the API's documented response shape into the view model used by the UI.
    function apiRecipeToUi(recipe) {
      const nutrients = recipe.macronutrients || {};
      const ingredientsList = Array.isArray(recipe.ingredients)
        ? recipe.ingredients.map((item) => {
            const amountGr = Number(item.amountGr ?? 0);
            const hasCustomAmount = item.customAmount !== null && item.customAmount !== undefined && item.customUnit;
            return {
              name: item.name || item.ingredient?.name || 'Ингредиент',
              amount: hasCustomAmount
                ? `${amountGr} г (${item.customAmount} ${item.customUnit})`
                : String(amountGr),
              unit: hasCustomAmount ? '' : 'г'
            };
          })
        : recipe.ingredientsList;

      return {
        ...recipe,
        id: recipe.id,
        title: recipe.name || recipe.title || 'Без названия',
        description: recipe.description || '',
        calories: Number(nutrients.calroies ?? nutrients.calories ?? recipe.calories ?? 0),
        proteins: Number(nutrients.protein ?? nutrients.proteins ?? recipe.proteins ?? 0),
        fats: Number(nutrients.fats ?? recipe.fats ?? 0),
        carbs: Number(nutrients.carbs ?? nutrients.carbohydrates ?? recipe.carbs ?? 0),
        ingredientsList,
        imageUrl: resolveRecipeImage({ ...recipe, ingredientsList })
      };
    }

    // Main App Component
    function App() {
      // States
      const [backendOnline, setBackendOnline] = useState(false);
      const [forceDemoMode, setForceDemoMode] = useState(false);
      const [ingredients, setIngredients] = useState([]);
      const [recipesList, setRecipesList] = useState([]);
      const [selectedIngredients, setSelectedIngredients] = useState(() => {
        try {
          const saved = JSON.parse(window.localStorage.getItem('cookly:selectedIngredients') || '[]');
          return Array.isArray(saved)
            ? saved.filter(item => item && item.id !== undefined && typeof item.name === 'string')
            : [];
        } catch (error) {
          return [];
        }
      });
      const [searchIngQuery, setSearchIngQuery] = useState('');
      const [recipeSearchQuery, setRecipeSearchQuery] = useState('');
      const [matchedRecipes, setMatchedRecipes] = useState([]);
      const [searchResults, setSearchResults] = useState([]);
      const [isGenerating, setIsGenerating] = useState(false);
      const [recipeSearchLoading, setRecipeSearchLoading] = useState(false);
      const [cookSearchMessage, setCookSearchMessage] = useState('');
      const [activeRecipeModal, setActiveRecipeModal] = useState(null);
      const [searchDropdownOpen, setSearchDropdownOpen] = useState(false);

      const API_URL = 'http://localhost:3000/api';

      // Persist selected ingredient IDs so the selection survives page reloads.
      useEffect(() => {
        try {
          window.localStorage.setItem(
            'cookly:selectedIngredients',
            JSON.stringify(selectedIngredients.map(({ id, name }) => ({ id, name })) )
          );
        } catch (error) {
          console.warn('Could not save selected ingredients:', error);
        }
      }, [selectedIngredients]);

      // Keep saved ingredient labels in sync with the database suggestions when IDs match.
      useEffect(() => {
        if (!backendOnline || ingredients.length === 0 || selectedIngredients.length === 0) return;
        setSelectedIngredients(current => current.map(saved => {
          const currentIngredient = ingredients.find(item => String(item.id) === String(saved.id));
          return currentIngredient ? { id: currentIngredient.id, name: currentIngredient.name } : saved;
        }));
      }, [ingredients, backendOnline]);

      // Initialize Lucide icons on DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Check the API and load the initial ingredient suggestions.
      useEffect(() => {
        let cancelled = false;
        const checkBackend = async () => {
          try {
            const healthResponse = await fetch(`${API_URL}/health`);
            if (!healthResponse.ok) throw new Error('API is unavailable');
            const response = await fetch(`${API_URL}/ingredients/search?q=`);
            if (!response.ok) throw new Error('Ingredient endpoint is unavailable');
            const data = await response.json();
            if (cancelled) return;
            setIngredients(Array.isArray(data) ? data : []);
            setBackendOnline(true);
          } catch (error) {
            if (cancelled) return;
            setBackendOnline(false);
            setIngredients(MOCK_INGREDIENTS);
          }
        };

        checkBackend();
        return () => { cancelled = true; };
      }, []);

      // Load the recipe cards from the documented search endpoint.
      useEffect(() => {
        let cancelled = false;
        const controller = new AbortController();

        if (!backendOnline || forceDemoMode) {
          setRecipesList(MOCK_RECIPES);
          return () => controller.abort();
        }

        fetch(`${API_URL}/recipes/search?q=`, { signal: controller.signal })
          .then(async (response) => {
            if (!response.ok) throw new Error('Recipe endpoint is unavailable');
            return response.json();
          })
          .then((data) => {
            if (!cancelled) setRecipesList(Array.isArray(data) ? data.map(apiRecipeToUi) : []);
          })
          .catch((error) => {
            if (!cancelled && error.name !== 'AbortError') setRecipesList(MOCK_RECIPES);
          });

        return () => { cancelled = true; controller.abort(); };
      }, [backendOnline, forceDemoMode]);

      // Debounced ingredient suggestions; the input is sent to /ingredients/search.
      useEffect(() => {
        if (!backendOnline || forceDemoMode) {
          setIngredients(MOCK_INGREDIENTS);
          return undefined;
        }

        const controller = new AbortController();
        const timer = window.setTimeout(async () => {
          try {
            const response = await fetch(
              `${API_URL}/ingredients/search?q=${encodeURIComponent(searchIngQuery.trim())}`,
              { signal: controller.signal }
            );
            if (!response.ok) throw new Error('Ingredient search failed');
            const data = await response.json();
            setIngredients(Array.isArray(data) ? data : []);
          } catch (error) {
            if (error.name !== 'AbortError') console.error('Ingredient search failed:', error);
          }
        }, 250);

        return () => { window.clearTimeout(timer); controller.abort(); };
      }, [searchIngQuery, backendOnline, forceDemoMode]);

      // Filter ingredient suggestions and hide already selected ingredients.
      const filteredIngredients = useMemo(() => {
        const query = searchIngQuery.trim().toLowerCase();
        return ingredients.filter(i =>
          (!query || i.name.toLowerCase().includes(query)) &&
          !selectedIngredients.some(s => String(s.id) === String(i.id))
        ).slice(0, 12);
      }, [ingredients, searchIngQuery, selectedIngredients]);

      // Debounced short search by recipe name. Details are loaded when a result is opened.
      useEffect(() => {
        const query = recipeSearchQuery.trim();
        if (!query) {
          setSearchResults([]);
          setRecipeSearchLoading(false);
          return undefined;
        }

        if (!backendOnline || forceDemoMode) {
          setSearchResults(MOCK_RECIPES.filter(recipe =>
            recipe.title.toLowerCase().includes(query.toLowerCase()) ||
            recipe.description?.toLowerCase().includes(query.toLowerCase())
          ));
          setRecipeSearchLoading(false);
          return undefined;
        }

        const controller = new AbortController();
        const timer = window.setTimeout(async () => {
          setRecipeSearchLoading(true);
          try {
            const response = await fetch(
              `${API_URL}/recipes/search?q=${encodeURIComponent(query)}`,
              { signal: controller.signal }
            );
            if (!response.ok) throw new Error('Recipe search failed');
            const data = await response.json();
            setSearchResults(Array.isArray(data) ? data.map(apiRecipeToUi) : []);
          } catch (error) {
            if (error.name !== 'AbortError') setSearchResults([]);
          } finally {
            setRecipeSearchLoading(false);
          }
        }, 250);

        return () => { window.clearTimeout(timer); controller.abort(); };
      }, [recipeSearchQuery, backendOnline, forceDemoMode, recipesList]);

      // Handle ingredient selection
      const toggleIngredient = (ing) => {
        if (selectedIngredients.some(s => String(s.id) === String(ing.id))) {
          setSelectedIngredients(selectedIngredients.filter(s => String(s.id) !== String(ing.id)));
        } else {
          setSelectedIngredients([...selectedIngredients, ing]);
        }
        setSearchIngQuery('');
      };

      const openRecipe = async (recipe) => {
        setSearchDropdownOpen(false);
        if (backendOnline && !forceDemoMode && Number.isInteger(Number(recipe.id))) {
          try {
            const response = await fetch(`${API_URL}/recipes/${Number(recipe.id)}`);
            if (!response.ok) throw new Error('Recipe details are unavailable');
            const details = await response.json();
            setActiveRecipeModal(apiRecipeToUi(details));
            return;
          } catch (error) {
            console.error('Could not load full recipe details:', error);
          }
        }
        setActiveRecipeModal(recipe);
      };

      // Match selected ingredients via /recipes/searchByIngredients.
      const handleCookNow = async () => {
        if (selectedIngredients.length === 0) return;

        setIsGenerating(true);
        setCookSearchMessage('');
        setMatchedRecipes([]);
        let results = [];

        try {
          if (backendOnline && !forceDemoMode) {
            const response = await fetch(`${API_URL}/recipes/searchByIngredients`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ ids: selectedIngredients.map(ingredient => Number(ingredient.id)) })
            });
            if (!response.ok) throw new Error('Ingredient matching failed');
            const data = await response.json();
            results = Array.isArray(data) ? data.map(apiRecipeToUi) : [];
          } else {
            const selectedIds = new Set(selectedIngredients.map(ingredient => String(ingredient.id)));
            results = MOCK_RECIPES.filter(recipe => recipe.ingredientIds.some(id => selectedIds.has(String(id))));
          }
        } catch (error) {
          console.error('Could not fetch recipes by ingredients:', error);
          setCookSearchMessage('Не удалось получить результаты API. Показаны демо-результаты.');
          const selectedIds = new Set(selectedIngredients.map(ingredient => String(ingredient.id)));
          results = MOCK_RECIPES.filter(recipe => recipe.ingredientIds.some(id => selectedIds.has(String(id))));
        } finally {
          setIsGenerating(false);
        }

        setMatchedRecipes(results);
        if (results.length === 0) {
          setCookSearchMessage('По выбранным ингредиентам рецепты не найдены. Попробуйте выбрать другие продукты.');
        }

        if (results.length > 0 && typeof confetti === 'function') {
          confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#f27c20', '#f9bd7d', '#22c55e']
          });
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER / NAVIGATION */}
          <header className="sticky top-0 z-40 glass-effect border-b border-orange-100/60 transition-all">
            <div className="max-w-6xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between">

              {/* Logo */}
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 bg-gradient-to-tr from-brand-600 to-brand-400 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-brand-500/30 transform hover:rotate-6 transition-transform">
                  <i data-lucide="utensils" className="w-6 h-6"></i>
                </div>
                <div>
                  <span className="text-2xl font-black bg-gradient-to-r from-brand-700 via-brand-500 to-brand-400 bg-clip-text text-transparent tracking-tight">
                    Cookly
                  </span>
                  <span className="hidden sm:inline-block ml-2 text-xs font-semibold px-2 py-0.5 bg-orange-100 text-brand-700 rounded-full">
                    v2.0
                  </span>
                </div>
              </div>

              {/* Status Indicator & Demo Toggle */}
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setForceDemoMode(!forceDemoMode)}
                  className={`text-xs px-3 py-1.5 rounded-xl font-medium transition-all flex items-center gap-2 border ${
                    forceDemoMode
                      ? 'bg-amber-100 border-amber-300 text-amber-800'
                      : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                  }`}
                  title="Переключить в демо-режим с локальными данными"
                >
                  <i data-lucide="database" className="w-3.5 h-3.5"></i>
                  <span>{forceDemoMode ? 'Демо Данные' : 'Live API'}</span>
                </button>

                <div className={`flex items-center gap-2 px-3 py-1.5 rounded-xl border text-xs font-medium ${
                  backendOnline && !forceDemoMode
                    ? 'bg-emerald-50 border-emerald-200 text-emerald-700'
                    : 'bg-orange-50 border-orange-200 text-brand-700'
                }`}>
                  <span className={`w-2 h-2 rounded-full ${
                    backendOnline && !forceDemoMode ? 'bg-emerald-500 animate-ping' : 'bg-brand-500'
                  }`}></span>
                  <span className="hidden md:inline">
                    {backendOnline && !forceDemoMode ? 'Сервер: localhost:3000' : 'Автономный режим'}
                  </span>
                </div>
              </div>

            </div>
          </header>

          <main className="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 space-y-12">

            {/* HERO SECTION */}
            <section className="relative overflow-hidden bg-gradient-to-br from-brand-50 via-cream to-orange-100/50 rounded-3xl p-8 sm:p-12 border border-brand-100/80 shadow-xl shadow-brand-500/5">
              <div className="relative z-10 max-w-2xl">
                <div className="inline-flex items-center gap-2 px-3 py-1 bg-white/80 backdrop-blur rounded-full text-brand-700 text-xs font-bold uppercase tracking-wider mb-4 border border-brand-200 shadow-sm">
                  <i data-lucide="sparkles" className="w-3.5 h-3.5 text-brand-500"></i>
                  Кулинарный ИИ-помощник
                </div>

                <h1 className="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight leading-tight mb-4">
                  Готовь вкусное из того, что <span className="underline decoration-brand-400 decoration-wavy decoration-2">уже есть</span> дома.
                </h1>

                <p className="text-lg text-slate-600 mb-8 leading-relaxed">
                  Выбери имеющиеся ингредиенты, и Cookly мгновенно подберет рецепты с точным расчетом КБЖУ и пошаговым руководством.
                </p>

                {/* Quick Stats Grid */}
                <div className="grid grid-cols-3 gap-4 pt-4 border-t border-brand-200/60">
                  <div className="text-center sm:text-left">
                    <div className="text-2xl font-black text-brand-600">100+</div>
                    <div className="text-xs text-slate-500 font-medium">Рецептов</div>
                  </div>
                  <div className="text-center sm:text-left">
                    <div className="text-2xl font-black text-brand-600">КБЖУ</div>
                    <div className="text-xs text-slate-500 font-medium">Точный подсчет</div>
                  </div>
                  <div className="text-center sm:text-left">
                    <div className="text-2xl font-black text-brand-600">100%</div>
                    <div className="text-xs text-slate-500 font-medium">Вкусно и просто</div>
                  </div>
                </div>
              </div>

              {/* Decorative Floating Badges */}
              <div className="hidden lg:block absolute right-10 top-1/2 -translate-y-1/2 w-80 h-80 pointer-events-none">
                <div className="absolute top-4 right-4 bg-white p-4 rounded-2xl shadow-xl border border-orange-100 animate-float flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-amber-100 flex items-center justify-center text-amber-600">
                    🥑
                  </div>
                  <div>
                    <div className="text-sm font-bold">Свежие идеи</div>
                    <div className="text-xs text-slate-400">Быстрые рецепты</div>
                  </div>
                </div>
                <div className="absolute bottom-6 left-2 bg-white p-4 rounded-2xl shadow-xl border border-orange-100 animate-float style-2 flex items-center gap-3" style={{ animationDelay: '1.5s' }}>
                  <div className="w-10 h-10 rounded-xl bg-orange-100 flex items-center justify-center text-brand-600">
                    🔥
                  </div>
                  <div>
                    <div className="text-sm font-bold">Контроль калорий</div>
                    <div className="text-xs text-slate-400">Баланс макросов</div>
                  </div>
                </div>
              </div>
            </section>

            {/* FEATURE 1: "ЧЁ СВАРИТЬ?" INGREDIENT MATCHING */}
            <section className="bg-white rounded-3xl p-6 sm:p-8 border border-slate-100 shadow-xl shadow-slate-100 space-y-6">
              <div className="flex items-center gap-3">
                <div className="p-3 bg-brand-100 text-brand-600 rounded-2xl">
                  <i data-lucide="chef-hat" className="w-6 h-6"></i>
                </div>
                <div>
                  <h2 className="text-2xl font-bold text-slate-900">Чё сварить?</h2>
                  <p className="text-sm text-slate-500">Выберите ингредиенты в холодильнике, чтобы найти блюдо</p>
                </div>
              </div>

              {/* Selected Ingredient Chips */}
              <div className="min-h-[56px] p-3 bg-cream rounded-2xl border border-brand-100 flex flex-wrap gap-2 items-center">
                {selectedIngredients.length === 0 ? (
                  <span className="text-sm text-slate-400 italic px-2">
                    Нажмите на ингредиенты ниже или найдите их через поиск...
                  </span>
                ) : (
                  selectedIngredients.map(ing => (
                    <span
                      key={ing.id}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 bg-brand-500 text-white rounded-xl text-sm font-medium shadow-md shadow-brand-500/20 transform transition hover:scale-105"
                    >
                      {ing.name}
                      <button
                        onClick={() => toggleIngredient(ing)}
                        className="hover:bg-brand-600 rounded-lg p-0.5 transition-colors"
                      >
                        <i data-lucide="x" className="w-3.5 h-3.5"></i>
                      </button>
                    </span>
                  ))
                )}
              </div>

              {/* Ingredient Search & Suggestions */}
              <div className="space-y-3">
                <div className="relative">
                  <i data-lucide="search" className="w-5 h-5 absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input
                    type="text"
                    value={searchIngQuery}
                    onChange={(e) => setSearchIngQuery(e.target.value)}
                    placeholder="Например: Курица, Сыр, Яйца..."
                    className="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200 transition-all"
                  />
                </div>

                {/* Quick Add Pills */}
                <div className="flex flex-wrap gap-2">
                  <span className="text-xs text-slate-400 self-center mr-1">Популярные:</span>
                  {filteredIngredients.map(ing => (
                    <button
                      key={ing.id}
                      onClick={() => toggleIngredient(ing)}
                      className="px-3 py-1.5 bg-slate-100 hover:bg-brand-100 hover:text-brand-700 text-slate-700 rounded-xl text-xs font-medium transition-all transform active:scale-95"
                    >
                      + {ing.name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Generate Action Button */}
              <div className="pt-2">
                <button
                  onClick={handleCookNow}
                  disabled={selectedIngredients.length === 0 || isGenerating}
                  className={`w-full sm:w-auto px-8 py-4 rounded-2xl font-bold text-white shadow-lg transition-all flex items-center justify-center gap-3 ${
                    selectedIngredients.length === 0
                      ? 'bg-slate-300 shadow-none cursor-not-allowed'
                      : 'bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-600 hover:to-brand-700 shadow-brand-500/30 transform hover:-translate-y-0.5 active:translate-y-0'
                  }`}
                >
                  {isGenerating ? (
                    <>
                      <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                      <span>Подбираем блюда...</span>
                    </>
                  ) : (
                    <>
                      <i data-lucide="wand-2" className="w-5 h-5"></i>
                      <span>Подобрать рецепты ({selectedIngredients.length})</span>
                    </>
                  )}
                </button>
              </div>

              {cookSearchMessage && (
                <p className="text-sm text-slate-500" role="status">{cookSearchMessage}</p>
              )}

              {/* Matched Recipe Results */}
              {matchedRecipes.length > 0 && (
                <div className="pt-6 border-t border-slate-100 space-y-4">
                  <div className="flex items-center justify-between">
                    <h3 className="text-lg font-bold text-slate-900 flex items-center gap-2">
                      <span>Найдено рецептов:</span>
                      <span className="px-2.5 py-0.5 bg-emerald-100 text-emerald-800 rounded-full text-xs font-extrabold">
                        {matchedRecipes.length}
                      </span>
                    </h3>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {matchedRecipes.map(recipe => (
                      <RecipeCard
                        key={recipe.id}
                        recipe={recipe}
                        onClick={() => openRecipe(recipe)}
                      />
                    ))}
                  </div>
                </div>
              )}
            </section>

            {/* FEATURE 2: BROWSE & QUICK SEARCH */}
            <section className="space-y-6">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                  <h2 className="text-2xl font-bold text-slate-900">Быстрый поиск рецептов</h2>
                  <p className="text-sm text-slate-500">Ищите по названию блюда или описанию</p>
                </div>

                {/* Search Bar with Dropdown */}
                <div className="relative w-full md:w-80">
                  <i data-lucide="search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                  <input
                    type="text"
                    value={recipeSearchQuery}
                    onChange={(e) => {
                      setRecipeSearchQuery(e.target.value);
                      setSearchDropdownOpen(true);
                    }}
                    onFocus={() => setSearchDropdownOpen(true)}
                    placeholder="Поиск рецепта..."
                    className="w-full pl-10 pr-9 py-2.5 bg-white border border-slate-200 rounded-2xl text-sm focus:outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-200 shadow-sm transition-all"
                  />
                  {recipeSearchQuery && (
                    <button
                      onClick={() => setRecipeSearchQuery('')}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                    >
                      <i data-lucide="x" className="w-4 h-4"></i>
                    </button>
                  )}

                  {/* Search Suggestion Dropdown */}
                  {searchDropdownOpen && recipeSearchQuery.trim() && (
                    <div className="absolute left-0 right-0 top-full mt-2 bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden z-30 max-h-60 overflow-y-auto">
                      {recipeSearchLoading ? (
                        <div className="p-4 text-center text-xs text-slate-400">Ищем рецепты...</div>
                      ) : searchResults.length > 0 ? (
                        searchResults.map(r => (
                          <div
                            key={r.id}
                            onClick={() => openRecipe(r)}
                            className="p-3 hover:bg-brand-50 cursor-pointer flex items-center justify-between border-b border-slate-50 last:border-none transition-colors"
                          >
                            <div>
                              <div className="text-sm font-bold text-slate-800">{r.title}</div>
                              <div className="text-xs text-slate-400">{r.calories} ккал</div>
                            </div>
                            <i data-lucide="chevron-right" className="w-4 h-4 text-brand-500"></i>
                          </div>
                        ))
                      ) : (
                        <div className="p-4 text-center text-xs text-slate-400">
                          Ничего не найдено
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>

              {/* All Recipes Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {recipesList.map(recipe => (
                  <RecipeCard
                    key={recipe.id}
                    recipe={recipe}
                    onClick={() => openRecipe(recipe)}
                  />
                ))}
              </div>
            </section>

          </main>

          {/* RECIPE DETAIL MODAL */}
          {activeRecipeModal && (
            <RecipeModal
              recipe={activeRecipeModal}
              onClose={() => setActiveRecipeModal(null)}
            />
          )}

          {/* FOOTER */}
          <footer className="bg-white border-t border-orange-100/60 mt-16 py-8">
            <div className="max-w-6xl mx-auto px-4 text-center text-slate-400 text-xs space-y-2">
              <p className="font-medium text-slate-600">Cookly App &copy; 2026 — Интерактивный кулинарный помощник</p>
              <p>Подключено к PostgreSQL / Prisma Backend API</p>
            </div>
          </footer>
        </div>
      );
    }

    // --- RECIPE CARD COMPONENT ---
    function RecipeCard({ recipe, onClick }) {
      return (
        <div
          onClick={onClick}
          className="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 cursor-pointer flex flex-col group"
        >
          <div className="relative h-48 overflow-hidden bg-slate-100">
            <img
              src={resolveRecipeImage(recipe)}
              alt={recipe.title}
              className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
              onError={useLocalImageFallback}
            />
            <div className="absolute top-3 right-3 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-slate-700 shadow-sm flex items-center gap-1">
              <i data-lucide="clock" className="w-3.5 h-3.5 text-brand-500"></i>
              <span>{recipe.time || 20} мин</span>
            </div>
          </div>

          <div className="p-5 flex-grow flex flex-col justify-between space-y-4">
            <div>
              <h3 className="font-bold text-lg text-slate-900 group-hover:text-brand-600 transition-colors line-clamp-1">
                {recipe.title}
              </h3>
              <p className="text-xs text-slate-500 line-clamp-2 mt-1">
                {recipe.description}
              </p>
            </div>

            {/* Macronutrients Tag Pill */}
            <div className="flex items-center justify-between text-xs pt-3 border-t border-slate-100">
              <span className="font-bold text-brand-600 bg-brand-50 px-2.5 py-1 rounded-lg">
                🔥 {recipe.calories} ккал
              </span>
              <div className="flex gap-2 text-slate-500 font-medium">
                <span>Б: {recipe.proteins}г</span>
                <span>Ж: {recipe.fats}г</span>
                <span>У: {recipe.carbs}г</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- RECIPE MODAL COMPONENT ---
    function RecipeModal({ recipe, onClose }) {
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [onClose]);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
          <div
            className="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl border border-slate-100 relative animate-scaleUp"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Close Button */}
            <button
              onClick={onClose}
              className="absolute top-4 right-4 z-10 w-10 h-10 bg-white/80 backdrop-blur rounded-full flex items-center justify-center text-slate-600 hover:bg-white shadow-md transition-all"
            >
              <i data-lucide="x" className="w-5 h-5"></i>
            </button>

            {/* Modal Hero Image */}
            <div className="relative h-64 sm:h-72 bg-slate-100">
              <img
                src={resolveRecipeImage(recipe)}
                alt={recipe.title}
                className="w-full h-full object-cover"
                onError={useLocalImageFallback}
              />
              <div className="absolute inset-0 bg-gradient-to-t from-slate-900/80 via-transparent to-transparent"></div>
              <div className="absolute bottom-6 left-6 right-6 text-white">
                <span className="px-3 py-1 bg-brand-500 text-white rounded-full text-xs font-bold uppercase tracking-wider mb-2 inline-block">
                  {recipe.difficulty || 'Простой'} рецепт
                </span>
                <h2 className="text-2xl sm:text-3xl font-black leading-tight">
                  {recipe.title}
                </h2>
              </div>
            </div>

            {/* Modal Body */}
            <div className="p-6 sm:p-8 space-y-6">

              {/* Macronutrient Stats Grid */}
              <div className="grid grid-cols-4 gap-3 p-4 bg-brand-50/60 rounded-2xl border border-brand-100 text-center">
                <div>
                  <div className="text-xs text-slate-500 font-medium">Калории</div>
                  <div className="text-lg font-black text-brand-600">{recipe.calories}</div>
                  <div className="text-[10px] text-slate-400">ккал</div>
                </div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Белки</div>
                  <div className="text-lg font-black text-slate-800">{recipe.proteins}г</div>
                  <div className="text-[10px] text-slate-400">протеин</div>
                </div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Жиры</div>
                  <div className="text-lg font-black text-slate-800">{recipe.fats}г</div>
                  <div className="text-[10px] text-slate-400">липиды</div>
                </div>
                <div>
                  <div className="text-xs text-slate-500 font-medium">Углеводы</div>
                  <div className="text-lg font-black text-slate-800">{recipe.carbs}г</div>
                  <div className="text-[10px] text-slate-400">углеводы</div>
                </div>
              </div>

              {/* Ingredients Section */}
              <div>
                <h3 className="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
                  <i data-lucide="shopping-bag" className="w-5 h-5 text-brand-500"></i>
                  <span>Ингредиенты</span>
                </h3>
                <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {(recipe.ingredientsList || [
                    { name: 'Ингредиенты из списка', amount: 'По вкусу', unit: '' }
                  ]).map((item, idx) => (
                    <li key={idx} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl text-sm border border-slate-100">
                      <span className="font-medium text-slate-700">{item.name}</span>
                      <span className="text-slate-500 font-bold text-xs">{item.amount} {item.unit}</span>
                    </li>
                  ))}
                </ul>
              </div>

              {/* Cooking Steps Section */}
              <div>
                <h3 className="text-lg font-bold text-slate-900 mb-3 flex items-center gap-2">
                  <i data-lucide="list-ordered" className="w-5 h-5 text-brand-500"></i>
                  <span>Шаги приготовления</span>
                </h3>
                <div className="space-y-3">
                  {(recipe.steps || [
                    'Подготовьте все необходимые ингредиенты.',
                    'Следуйте стандартной технологии обжарки и тушения.',
                    'Подавайте горячим с любимой зеленью!'
                  ]).map((step, idx) => (
                    <div key={idx} className="flex gap-4 p-3 bg-cream rounded-2xl border border-brand-100/60">
                      <div className="w-7 h-7 rounded-xl bg-brand-500 text-white font-bold text-sm flex items-center justify-center shrink-0">
                        {idx + 1}
                      </div>
                      <p className="text-sm text-slate-700 leading-relaxed self-center">
                        {step}
                      </p>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </div>
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
