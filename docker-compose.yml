services:
  postgres:
    image: postgres:latest
    container_name: cookly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cookly
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  pg_tests:
    image: postgres:latest
    container_name: cookly-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: cookly-tests
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: