
services:
  postgres:
    image: postgres:18-alpine
    container_name: cookly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cookly
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cookly"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cookly-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://admin:admin@postgres:5432/cookly?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./content/recipes_import_filled.xlsx:/app/content/recipes_import_filled.xlsx:ro

  frontend:
    image: nginx:alpine
    container_name: cookly-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
