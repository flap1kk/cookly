services:
  postgres:
    image: postgres:latest
    container_name: cookly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cookly
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cookly-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/cookly?schema=public
    depends_on:
      - postgres
